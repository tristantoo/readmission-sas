<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g fill="#1f1f1e">
    <text x="20" y="26" font-size="15" font-weight="600">Rows at each step (reference counts the SAS run must reproduce)</text>
  </g>
  <!-- column 1: mart -->
  <g stroke="#2a78d6" fill="#eaf2fc">
    <rect x="20" y="50" width="220" height="52" rx="6"/>
    <rect x="20" y="130" width="220" height="52" rx="6"/>
    <rect x="20" y="210" width="220" height="52" rx="6"/>
  </g>
  <g fill="#1f1f1e">
    <text x="32" y="72" font-weight="600">01 import: inpatient.csv</text>
    <text x="32" y="91">66,773 claim rows</text>
    <text x="32" y="152" font-weight="600">02 keep segment 1</text>
    <text x="32" y="171">66,705 claims</text>
    <text x="32" y="232" font-weight="600">02 transfer merge (RETAIN)</text>
    <text x="32" y="251">64,273 stays</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="130" y1="102" x2="130" y2="128"/>
    <line x1="130" y1="182" x2="130" y2="208"/>
    <line x1="240" y1="236" x2="288" y2="236"/>
  </g>
  <!-- column 2: index stays by split -->
  <g stroke="#eb6834" fill="#fdeee7">
    <rect x="290" y="130" width="210" height="76" rx="6"/>
    <rect x="290" y="230" width="210" height="76" rx="6"/>
  </g>
  <g fill="#1f1f1e">
    <text x="302" y="152" font-weight="600">Train: 2009 discharges</text>
    <text x="302" y="171">24,693 in window</text>
    <text x="302" y="190">17,857 index, 1,296 readmits</text>
    <text x="302" y="252" font-weight="600">Test: 2010-01-01 to 12-01</text>
    <text x="302" y="271">13,401 in window</text>
    <text x="302" y="290">9,385 index, 369 readmits</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="500" y1="168" x2="548" y2="168"/>
    <line x1="500" y1="268" x2="548" y2="268"/>
    <line x1="650" y1="196" x2="650" y2="238"/>
  </g>
  <!-- column 3: model -->
  <g stroke="#3a8a4a" fill="#e9f5ec">
    <rect x="550" y="140" width="190" height="56" rx="6"/>
    <rect x="550" y="240" width="190" height="56" rx="6"/>
  </g>
  <g fill="#1f1f1e">
    <text x="562" y="162" font-weight="600">04 PROC LOGISTIC fit</text>
    <text x="562" y="181">21 coefficients</text>
    <text x="562" y="262" font-weight="600">04 SCORE on test</text>
    <text x="562" y="281">AUC 0.612, deciles, O/E</text>
  </g>
  <!-- parity bar -->
  <rect x="20" y="340" width="720" height="62" rx="6" fill="#f4f4f2" stroke="#8a897f"/>
  <g fill="#1f1f1e">
    <text x="32" y="364" font-weight="600">06 parity: 129 checks, PASS if |SAS value - reference| &lt;= tolerance</text>
    <text x="32" y="386">52 mart counts from SQL Server (tolerance 0) + 77 model values from the Python GLM (small tolerances)</text>
  </g>
  <g stroke="#8a897f" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#a)">
    <line x1="130" y1="262" x2="130" y2="338"/>
    <line x1="395" y1="306" x2="395" y2="338"/>
    <line x1="645" y1="296" x2="645" y2="338"/>
  </g>
</svg>
